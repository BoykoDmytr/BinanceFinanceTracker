name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - claude/mobile-scroll-tracker-wt0jni
  workflow_dispatch:

permissions:
  contents: write

# один спільний реліз apk-latest — нові пуші скасовують збірку, що ще триває
concurrency:
  group: build-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify calculations against the Excel control numbers
        run: npm run test:calc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk cryptofinance-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptofinance-tracker-apk
          path: cryptofinance-tracker.apk

      - name: Remove old-named asset from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset apk-latest crypto-hornet.apk -y --repo "$GITHUB_REPOSITORY" || true

      - name: Publish APK to "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CryptoFinance Tracker — останній APK
          body: |
            Найсвіжіша збірка застосунку CryptoFinance Tracker.

            **Як встановити:** скачай `cryptofinance-tracker.apk` на телефон, відкрий файл
            і дозволь встановлення з невідомих джерел, коли Android запитає.
          files: cryptofinance-tracker.apk
          prerelease: false
