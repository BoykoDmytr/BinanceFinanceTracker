name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - claude/mobile-scroll-tracker-wt0jni
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify calculations against the Excel control numbers
        run: npm run test:calc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk crypto-hornet.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-hornet-apk
          path: crypto-hornet.apk

      - name: Publish APK to "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Crypto Hornet — останній APK
          body: |
            Найсвіжіша збірка застосунку Crypto Hornet.

            **Як встановити:** скачай `crypto-hornet.apk` на телефон, відкрий файл
            і дозволь встановлення з невідомих джерел, коли Android запитає.
          files: crypto-hornet.apk
          prerelease: false
